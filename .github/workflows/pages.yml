name: Pages

# Builds the landing page and documentation (site/ plus docs/*.md) and deploys it to GitHub Pages
# at querdian.dev. The custom domain is set by site/static/CNAME and the repository's Pages settings.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Generate docs pages
        run: site/build-content.sh
      # Pinned and run from the module proxy so it stays out of go.mod; Renovate bumps the version.
      - name: Build site
        run: go run github.com/gohugoio/hugo@v0.169.0 --source site --minify --gc
      - name: Check internal links and files
        run: |
          set -euo pipefail
          for f in index.html docs/index.html docs/quickstart/index.html 404.html CNAME; do
            test -s "site/public/$f" || { echo "missing $f" >&2; exit 1; }
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # verify the deployment source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
