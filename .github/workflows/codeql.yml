name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 2" # weekly, Tuesday 03:41 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: codeql (go)
    # Code scanning on a private repository needs GitHub Advanced Security; skipped until public.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      # See ci.yml. A push to main and the weekly run always analyze the code, so that each commit of main
      # has an analysis for the comparison with a pull request.
      - id: changes
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/changes
      - if: steps.changes.outputs.go != 'false'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: steps.changes.outputs.go != 'false'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          build-mode: autobuild
      - if: steps.changes.outputs.go != 'false'
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:go"
