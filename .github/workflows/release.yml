name: Release

# Tag push v* -> GitHub release (binaries, checksums, SBOMs), multi-arch image on
# ghcr.io, cosign keyless signatures, SLSA build provenance, Helm chart on OCI.
#
# Provenance: GitHub artifact attestations (actions/attest-build-provenance), not
# slsa-github-generator. Reasons: GoReleaser builds and publishes in one job, which
# the generator's reusable-workflow model (separate hash hand-off job, must be
# referenced by tag, not SHA) does not fit; attestations are SLSA v1 provenance
# signed with Sigstore via the same OIDC token, can be attached to the image in the
# registry, and verify with `gh attestation verify`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the GitHub release and upload assets
      packages: write # push the image to ghcr.io
      id-token: write # cosign keyless signing and attestations (OIDC)
      attestations: write # store build provenance attestations
      artifact-metadata: write # storage record for the pushed image (attest-build-provenance)
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs tags and history for the changelog
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Derive version from tag
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$REF_NAME' is not a semver tag (vMAJOR.MINOR.PATCH[-pre])"
            exit 1
          fi
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # The chart job needs CHANGELOG entries for the Artifact Hub changelog; fail before anything
      # is published rather than after the release and image exist.
      - name: Check CHANGELOG entries of the version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: go run ./hack/chartmeta -version "$VERSION" -out /dev/null
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        id: goreleaser
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect attestation subjects
        id: subjects
        run: |
          set -euo pipefail
          checksums="$(ls dist/*_checksums.txt)"
          echo "checksums=${checksums}" >> "$GITHUB_OUTPUT"
          # Digest of the pushed multi-arch manifest list. GoReleaser writes dockers_v2 images
          # as type "Docker Image" with the digest under extra.Digest (capital D).
          digest="$(jq -r '[.[] | select(.type == "Docker Image" or .type == "Docker Manifest") | .extra.Digest // empty][0] // empty' dist/artifacts.json)"
          if [ -z "$digest" ]; then
            echo "::error::no image digest found in dist/artifacts.json"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Attest provenance of release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ steps.subjects.outputs.checksums }}
      - name: Attest provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/querdian-dev/querdian
          subject-digest: ${{ steps.subjects.outputs.digest }}
          push-to-registry: true

  chart:
    name: publish chart
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push the chart to ghcr.io
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # cosign reads Docker's credential store, not Helm's registry config; without this
      # it signs anonymously and ghcr.io rejects it while the package is private.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Artifact Hub changelog and per-version flags. Fails a release whose CHANGELOG.md section
      # has no entries (docs/releasing.md, "Artifact Hub").
      - name: Add Artifact Hub release annotations
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: go run ./hack/chartmeta -version "$VERSION"
      - name: Package chart
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          helm lint charts/querdian
          helm package charts/querdian --version "$VERSION" --app-version "$VERSION" --destination dist
      - name: Push and sign chart
        env:
          VERSION: ${{ needs.release.outputs.version }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_PASSWORD" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          helm push "dist/querdian-${VERSION}.tgz" oci://ghcr.io/querdian-dev/charts 2>&1 | tee push.log
          digest="$(sed -n 's/^Digest: //p' push.log)"
          test -n "$digest"
          cosign sign --yes "ghcr.io/querdian-dev/charts/querdian@${digest}"
      # Repository metadata for Artifact Hub (ownership claim, verified publisher, ignored
      # versions), read from the special tag "artifacthub.io". oras is pinned by module version
      # and verified against sum.golang.org; it uses the docker login above.
      - name: Push Artifact Hub repository metadata
        working-directory: charts
        run: |
          go run oras.land/oras/cmd/oras@v1.3.6 push \
            ghcr.io/querdian-dev/charts/querdian:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
