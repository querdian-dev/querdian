name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            author=$(git log -1 --format='%ae' "$sha")
            committer=$(git log -1 --format='%ce' "$sha")
            signoffs=$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")
            if ! printf '%s\n' "$signoffs" | grep -qiF -e "<${author}>" -e "<${committer}>"; then
              echo "::error::Commit ${sha} has no Signed-off-by matching its author or committer email. Use 'git commit -s'."
              fail=1
            fi
          done
          exit "$fail"
