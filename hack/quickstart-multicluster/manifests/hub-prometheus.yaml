# Prometheus of the hub. It is hack/quickstart/manifests/prometheus.yaml with these changes:
#  * the scrape config writes the target label cluster="hub" (multicluster.hubCluster), so hub
#    telemetry carries the hub cluster label (docs/multicluster.md, step 2);
#  * --web.enable-otlp-receiver: the ingest gateway writes the metrics of the spokes over OTLP;
#  * the history of each cluster (hack/quickstart/demogen with -cluster): the init container writes the
#    blocks of the hub before Prometheus starts. The spokes connect later, after the check of migration
#    step 2, so up.sh writes their blocks with the sidecar `history` into the running Prometheus.
#    Prometheus loads new blocks every minute (reloadBlocks) and does not change its head for them.
#    Each history ends before the live data of its cluster starts (-end), so no time is counted twice.
#    LIMIT: after a restart of the container, Prometheus truncates its head to the end of the newest
#    block, so the first minutes of live data are lost. A new pod has only the history of the hub.
#
# CLUSTER-LABEL INTEGRITY: a scraped series that has its own cluster="..." label keeps the value of the
# target label, and Prometheus renames the series label to exported_cluster (honor_labels: false).
# DEMO LIMIT: the OTLP endpoint has no authentication. Each pod of the hub can write to it, also with
# the cluster label of a spoke. Only the ingest gateway must write to it (PLAN 18.8); in a real hub,
# restrict it with a NetworkPolicy (for example the backendProtection values of the chart).
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: observability}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: quickstart-prometheus}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: quickstart-prometheus}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: quickstart-prometheus}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: observability}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus, namespace: observability}
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: annotated-pods
        honor_labels: false
        fallback_scrape_protocol: PrometheusText0.0.4
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+);(.+)
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: job
          # The hub cluster label (multicluster.hubCluster in hub-values.yaml).
          - action: replace
            target_label: cluster
            replacement: "@@HUB_NAME@@"
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: observability}
spec:
  selector: {app: prometheus}
  ports: [{name: http, port: 9090, targetPort: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: observability}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata:
      labels: {app: prometheus}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9090", prometheus.io/path: /metrics}
    spec:
      serviceAccountName: prometheus
      initContainers:
        # The history of the hub (as in hack/quickstart/manifests/prometheus.yaml, with the hub cluster).
        - name: backfill
          image: @@DEMOGEN_IMAGE@@
          imagePullPolicy: Never # built by up.sh and loaded into kind
          command: [sh, -c]
          args:
            - |
              set -e
              if ls /prometheus/01* >/dev/null 2>&1; then echo "history already in place"; exit 0; fi
              demogen metrics -hours @@DEMO_HISTORY_HOURS@@ -step 30s -end @@HISTORY_END@@ -seed 1 -cluster @@HUB_NAME@@ > /work/history.om
              promtool tsdb create-blocks-from openmetrics /work/history.om /prometheus
              rm -f /work/history.om
          resources:
            requests: {cpu: 50m, memory: 100Mi}
            limits: {memory: 400Mi}
          volumeMounts:
            - {name: data, mountPath: /prometheus}
            - {name: work, mountPath: /work}
      containers:
        # The history of the spokes: up.sh runs demogen and promtool in this container (kubectl exec).
        # It only waits; its own memory limit keeps promtool away from the limit of Prometheus.
        - name: history
          image: @@DEMOGEN_IMAGE@@
          imagePullPolicy: Never
          command: [sh, -c, 'trap "exit 0" TERM; while :; do sleep 3600 & wait $!; done']
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 400Mi}
          volumeMounts:
            - {name: data, mountPath: /prometheus}
            - {name: work, mountPath: /work}
        - name: prometheus
          image: docker.io/prom/prometheus:v3.15.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=@@RETENTION_HOURS@@h
            - --web.enable-otlp-receiver
          ports: [{containerPort: 9090}]
          readinessProbe: {httpGet: {path: /-/ready, port: 9090}, periodSeconds: 5}
          resources:
            requests: {cpu: 50m, memory: 100Mi}
            limits: {memory: 400Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus}
        - name: data
          emptyDir: {}
        - name: work
          emptyDir: {}
