# Tempo single binary with multitenancy. The OTel Collector writes spans with the header
# X-Scope-OrgID: demo; Querdian sets the header on reads.
apiVersion: v1
kind: ConfigMap
metadata: {name: tempo, namespace: observability}
data:
  tempo.yaml: |
    multitenancy_enabled: true
    usage_report: {reporting_enabled: false}
    server: {http_listen_port: 3200}
    query_frontend:
      multi_tenant_queries_enabled: true
    distributor:
      receivers:
        otlp:
          protocols:
            http: {endpoint: "0.0.0.0:4318"}
    # Tempo 3 monolithic: the live-store replaces the ingester and needs no Kafka. It has its own WAL
    # slack (default 2m), which must cover the backfilled history: with spans outside the slack a block
    # gets the ingestion time as its range, and searches over the history do not find it (black-box).
    live_store:
      max_block_duration: 2m
      wal:
        ingestion_time_range_slack: @@RETENTION_HOURS@@h
    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
          ingestion_time_range_slack: @@RETENTION_HOURS@@h
        blocklist_poll: 30s
        local: {path: /var/tempo/blocks}
    # Retention moved from the compactor to the backend scheduler and worker; the per-tenant
    # override takes precedence over their global default (336h).
    overrides:
      defaults:
        compaction:
          block_retention: @@RETENTION_HOURS@@h
---
apiVersion: v1
kind: Service
metadata: {name: tempo, namespace: observability}
spec:
  selector: {app: tempo}
  ports:
    - {name: http, port: 3200, targetPort: 3200}
    - {name: otlp-http, port: 4318, targetPort: 4318}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tempo, namespace: observability}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: tempo}}
  template:
    metadata: {labels: {app: tempo}}
    spec:
      securityContext: {fsGroup: 10001}
      containers:
        - name: tempo
          image: docker.io/grafana/tempo:3.1.1
          args: [-config.file=/etc/tempo/tempo.yaml]
          # The 24 h history makes searches and compaction touch more data; keep the Go heap
          # below the container limit so that the GC works before the kernel's OOM killer does.
          env: [{name: GOMEMLIMIT, value: 500MiB}]
          ports: [{containerPort: 3200}, {containerPort: 4318}]
          readinessProbe: {httpGet: {path: /ready, port: 3200}, periodSeconds: 5, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 50m, memory: 200Mi}
            limits: {memory: 700Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/tempo}
            - {name: data, mountPath: /var/tempo}
      volumes:
        - name: config
          configMap: {name: tempo}
        - name: data
          emptyDir: {}
