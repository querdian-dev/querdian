{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "querdian.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "querdian.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "querdian.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- with $np.ingress.from }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.proxy.port }}
          protocol: TCP
    {{- end }}
    {{- with $np.ingress.managementFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.management.port }}
          protocol: TCP
    {{- end }}
    {{- if and $.Values.ui.enabled $np.ingress.uiFrom }}
    - from:
        {{- toYaml $np.ingress.uiFrom | nindent 8 }}
      ports:
        - port: {{ $.Values.ui.port }}
          protocol: TCP
    {{- end }}
  egress:
    {{- if $np.egress.dns.enabled }}
    - to:
        {{- toYaml $np.egress.dns.to | nindent 8 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- if $np.egress.kubeApi.enabled }}
    - {{- with $np.egress.kubeApi.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ports:
        {{- range $np.egress.kubeApi.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- if $np.egress.backends.ports }}
    - {{- with $np.egress.backends.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ports:
        {{- range $np.egress.backends.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- if $np.egress.oidc.enabled }}
    - {{- with $np.egress.oidc.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ports:
        {{- range $np.egress.oidc.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- if $np.egress.tracing.enabled }}
    - {{- with $np.egress.tracing.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ports:
        {{- range $np.egress.tracing.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- with $np.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
