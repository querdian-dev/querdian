# Default values for the querdian chart. See README.md for a description of every value.

nameOverride: ""
fullnameOverride: ""
commonLabels: {}

# What the chart installs (PLAN section 18):
#   proxy: the proxy. This is a single cluster, or the hub of a multi-cluster deployment if you set
#          config.multicluster (and optionally receiver.enabled).
#   spoke: only the policy agent of a spoke cluster (see `agent`). No proxy, no proxy RBAC.
# The agent and the proxy are mutually exclusive: both write the status of the spoke policies. Agent
# values with mode proxy stop the render.
mode: proxy

image:
  repository: ghcr.io/querdian-dev/querdian
  # Defaults to the chart appVersion.
  tag: ""
  # If set, takes precedence over tag (e.g. sha256:...).
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Two replicas: every replica serves traffic from its own policy snapshot; one is the
# leader and writes policy status.
replicaCount: 2

proxy:
  # Container port of the proxy listener (--listen=:<port>).
  port: 8080
management:
  # Container port of /metrics, /healthz and /readyz (--management-listen=:<port>).
  port: 9090
  service:
    # Create a separate ClusterIP Service for the management port.
    # Implied by serviceMonitor.enabled.
    enabled: false
    port: 9090

# Optional read-only policy dashboard (--ui-listen). Off by default. It shows group names, tenants and
# matchers, so keep it cluster-internal and reach it with kubectl port-forward or an authenticating ingress.
ui:
  enabled: false
  # Container port of the dashboard listener.
  port: 8081
  # oidc: every request needs a valid bearer token (and the admin group, if set). none: no authentication,
  # only for a trusted network, for example kubectl port-forward.
  auth: oidc
  adminGroup: ""
  # More host names that the dashboard accepts in the Host header, with any port. localhost, 127.0.0.1 and
  # [::1] are always accepted, so kubectl port-forward needs nothing here. Add the host name of an Ingress
  # or a proxy in front of the dashboard. Other hosts get 403.
  allowedHosts: []
  service:
    # Create a Service for the dashboard port.
    enabled: false
    # ClusterIP, or NodePort for local clusters such as the kind quickstart. Never LoadBalancer.
    type: ClusterIP
    port: 8081
    nodePort: null

service:
  type: ClusterIP
  port: 8080
  annotations: {}

# Process flags (PLAN section 5.2).
leaderElection:
  enabled: true
logLevel: info # debug | info | warn | error
logFormat: json # json | text

# Tracing is configured with the standard OTEL_* environment variables.
# With no endpoint and no exporter set, tracing is disabled.
tracing:
  # Adds enduser.id to spans (privacy-sensitive).
  recordUser: false
  # Adds original and rewritten queries to spans, and the query string to the upstream URL
  # (privacy-sensitive).
  recordQueries: false
  # Uses the trace context of the client as the parent of the server span. Keep it false unless
  # all clients are trusted: else a client can select the trace ID and force sampling.
  trustInboundContext: false
  serviceName: querdian # OTEL_SERVICE_NAME
  exporter: "" # OTEL_TRACES_EXPORTER (e.g. otlp, none)
  otlp:
    endpoint: "" # OTEL_EXPORTER_OTLP_ENDPOINT
    protocol: "" # OTEL_EXPORTER_OTLP_PROTOCOL (grpc | http/protobuf)
  sampler: parentbased_traceidratio # OTEL_TRACES_SAMPLER
  samplerArg: "0.1" # OTEL_TRACES_SAMPLER_ARG
  # Extra OTEL_RESOURCE_ATTRIBUTES as key: value. k8s.pod.name, k8s.namespace.name and
  # k8s.node.name are always added from the Downward API.
  resourceAttributes: {}

# Static configuration file (PLAN section 5.1), rendered verbatim into the ConfigMap.
# The values below are EXAMPLES: replace issuer, audiences and backends for your environment.
config:
  auth:
    issuer: https://keycloak.example.com/realms/observability
    audiences: [querdian]
    claims:
      username: preferred_username
      groups: groups
  backends:
    - name: metrics
      type: prometheus
      url: http://thanos-query.monitoring:10902
      pathPrefix: /prometheus
      namespaceLabel: namespace
      tenantFederation: none
    - name: logs
      type: loki
      url: http://loki-gateway.monitoring
      pathPrefix: /loki
      namespaceLabel: k8s_namespace_name
      tenantHeader: X-Scope-OrgID
      tenantFederation: tenantIdLabel
    - name: traces
      type: tempo
      url: http://tempo-query-frontend.monitoring:3200
      pathPrefix: /tempo
      namespaceLabel: resource.k8s.namespace.name
      tenantHeader: X-Scope-OrgID
      tenantFederation: none
      traceByID: filter
  limits:
    maxPolicyTerms: 16
    maxFanout: 16
    maxMergeBytes: 67108864
    # Buffered fan-out bodies of all requests together. Default 2 x maxMergeBytes. Keep
    # resources.limits.memory at about 4 x this value. See docs/operations.md.
    # maxInflightMergeBytes: 134217728
    upstreamTimeout: 5m
  # Hub of a multi-cluster deployment (PLAN section 18.4). Off when absent. If you set it, each backend
  # needs clusterLabel, and Querdian refuses to start if one backend has no clusterLabel. A backend with
  # clusterLabel but no multicluster block is also refused. Do the steps of PLAN section 18.8 in order
  # before you set it.
  # multicluster:
  #   hubCluster: mla       # cluster label value of the hub telemetry (required)
  #   maxStaleness: 48h     # time limit of spoke policies without a valid sync (default 48h)
  # backends:
  #   - name: metrics
  #     ...
  #     clusterLabel: cluster

# Extra CA bundle (PEM) trusted for the OIDC issuer. Set exactly one of the two; the chart mounts
# it and sets config.auth.caFile automatically.
oidcCA:
  existingSecret: ""
  existingConfigMap: ""
  key: ca.crt

extraArgs: []
extraEnv: []
extraVolumes: []
extraVolumeMounts: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

terminationGracePeriodSeconds: 45
priorityClassName: ""
podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

# Pod anti-affinity preset used when `affinity` is empty: soft | hard | "" (none).
podAntiAffinityPreset: soft
# Full affinity override (replaces the preset).
affinity: {}
topologySpreadConstraints: []
nodeSelector: {}
tolerations: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # If set, used instead of minAvailable.
  maxUnavailable: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

serviceMonitor:
  enabled: false
  namespace: "" # defaults to the release namespace
  labels: {} # e.g. release: kube-prometheus-stack
  interval: 30s
  scrapeTimeout: 10s
  relabelings: []
  metricRelabelings: []

networkPolicy:
  # NetworkPolicy for the querdian pods themselves (requires a CNI that enforces policies).
  enabled: false
  ingress:
    # Peers (NetworkPolicyPeer list) allowed to reach the proxy port, e.g. Grafana.
    # Empty means: from nowhere (default deny), so set this when enabling the policy.
    from: []
    # Peers allowed to reach the management port (e.g. Prometheus). Empty = nobody.
    managementFrom: []
    # Peers allowed to reach the dashboard port (only used when ui.enabled). Empty = nobody.
    uiFrom: []
    # Peers allowed to reach the receiver port (only used when receiver.enabled), e.g. the load balancer
    # or the TLS passthrough gateway of the spoke agents. Empty = nobody.
    receiverFrom: []
  egress:
    dns:
      enabled: true
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    kubeApi:
      enabled: true
      # Restrict to the API server address(es) when known, e.g. [{ipBlock: {cidr: 10.0.0.1/32}}].
      # Empty allows the ports below to any destination.
      to: []
      ports: [443, 6443]
    # Peers and ports of the configured backends (config.backends[].url).
    backends:
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports: [10902, 80, 3200]
    # OIDC issuer. Empty `to` allows the ports to any destination.
    oidc:
      enabled: true
      to: []
      ports: [443]
    # Optional OTLP collector.
    tracing:
      enabled: false
      to: []
      ports: [4317, 4318]
    # Hub receiver, for the agent of mode spoke only. Empty `to` allows the ports to any destination.
    receiver:
      to: []
      ports: [8443]
    # Raw additional egress rules.
    extra: []

  # Companion policies placed in the BACKEND namespaces so that only querdian pods can reach the
  # backends (PLAN section 12: "Backends must not be reachable by clients directly").
  # Beware: a pod selected by an ingress policy only accepts the listed sources, so add every
  # legitimate client (collectors writing to Loki/Tempo, Prometheus scrapers, ...) to allowFrom.
  backendProtection:
    enabled: false
    targets: []
    # - namespace: monitoring
    #   podSelector:
    #     matchLabels: {app.kubernetes.io/name: loki}
    #   ports: [3100, 80]
    #   allowFrom: []     # extra NetworkPolicyPeers allowed in addition to querdian

# Grafana dashboard shipped as a ConfigMap for the Grafana sidecar (dashboards/querdian.json).
dashboards:
  enabled: false
  # Namespace for the ConfigMap; defaults to the release namespace.
  namespace: ""
  # Label the Grafana dashboards sidecar selects on.
  labels:
    grafana_dashboard: "1"
  annotations: {}

# Receiver of a hub (`querdian receiver`, PLAN section 18.5). It accepts the policy syncs of the spoke
# agents over mTLS and writes SpokePolicy objects and SpokeCluster status. Needs mode proxy and
# config.multicluster. It runs as a separate Deployment with its own ServiceAccount, so the proxy keeps no
# write path.
receiver:
  enabled: false
  # Only the leader serves and reports ready. A second replica waits and takes the lease if the leader
  # stops. But then `kubectl rollout status` and `helm --wait` do not finish, because one replica is
  # never ready.
  replicaCount: 1
  leaderElection:
    # Do not disable it with more than one replica.
    enabled: true
  # Container port of the mTLS listener (--listen).
  port: 8443
  # Container port of /healthz and /readyz (--management-listen). The receiver has no /metrics.
  managementPort: 9090
  # The receiver terminates TLS itself. A load balancer or an ingress in front of it must pass TLS
  # through. It must not terminate TLS.
  service:
    type: ClusterIP # ClusterIP | NodePort | LoadBalancer
    port: 8443
    # Only with type NodePort: a fixed node port (30000-32767), so that the receiver URL of the agents stays
    # the same after a reinstall. Empty means a port that Kubernetes selects. The chart ignores the value
    # for the other types, also for LoadBalancer.
    nodePort: null
    annotations: {}
    # Only with type LoadBalancer.
    loadBalancerSourceRanges: []
  tls:
    # Secret (type kubernetes.io/tls) with tls.crt and tls.key: the server cert of the receiver. Required.
    # The receiver reads the cert and the client CA at startup only. Restart it after a rotation.
    existingSecret: ""
  clientCA:
    # Secret with the CA bundle that verifies the agent client certs. Required. Only the hub may issue
    # certs from this CA; a spoke must not. Do not use the CA of the ingest certs.
    existingSecret: ""
    key: ca.crt
  serviceAccount:
    create: true
    name: "" # default: <fullname>-receiver
    annotations: {}
  # More flags, e.g. --max-body-bytes, --max-policies, --max-in-flight.
  extraArgs: []
  # One request uses at most about 50 MiB with the default limits. The memory limit must be at least
  # 64Mi plus 50Mi for each request of --max-in-flight (default 8). Raise it if you raise the flags.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi
  podAnnotations: {}
  podLabels: {}
  affinity: {}
  nodeSelector: {}
  tolerations: []

# Policy agent of a spoke (`querdian agent`, PLAN section 18.5). Installed only with mode spoke. It reads
# the ClusterAccessPolicy, AccessPolicy and Namespace objects of the spoke and sends them to the receiver
# of the hub. It needs only an outbound path to the receiver.
agent:
  # Base URL of the hub receiver, e.g. https://querdian-receiver.mla.example.com:8443. Required.
  receiverURL: ""
  # Time between two heartbeats (--heartbeat-interval): <n>s, <n>m or <n>h, with an integer n, at least 10s.
  heartbeatInterval: 1m
  replicaCount: 1
  leaderElection:
    # Do not disable it with more than one replica.
    enabled: true
  # Container port of /healthz, /readyz and /metrics (--management-listen).
  managementPort: 9090
  tls:
    # Secret (type kubernetes.io/tls) with tls.crt and tls.key: the client cert of the agent. Required.
    # Use a dedicated cert. It must not be the ingest cert of the spoke, and its URI SAN must be equal to
    # spec.identity of the SpokeCluster object on the hub. The agent reads the files again before each
    # request, so a rotated cert takes effect without a restart.
    existingSecret: ""
  receiverCA:
    # Secret with the CA bundle that verifies the server cert of the receiver. Required. It can be the
    # same Secret as tls.existingSecret.
    existingSecret: ""
    key: ca.crt
  serviceAccount:
    create: true
    name: "" # default: <fullname>-agent
    annotations: {}
  # More flags, e.g. --request-timeout.
  extraArgs: []
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  podAnnotations: {}
  podLabels: {}
  affinity: {}
  nodeSelector: {}
  tolerations: []

# PrometheusRule (Prometheus Operator) with the alerts for spoke policies (PLAN section 18.6). Needs
# config.multicluster, and Prometheus must scrape the proxy (see serviceMonitor).
prometheusRule:
  enabled: false
  namespace: "" # defaults to the release namespace
  labels: {} # e.g. release: kube-prometheus-stack
  # QuerdianSpokePolicyStale fires if the last valid sync of a spoke is older than this value, in
  # seconds. The default is 24 hours, half of the default maxStaleness.
  policyAgeThresholdSeconds: 86400
  # QuerdianSpokePolicyExpired fires if the policies of a spoke are expired or the spoke is suspended.
  # `for` and `severity` apply to the two alerts.
  for: 10m
  severity: warning
