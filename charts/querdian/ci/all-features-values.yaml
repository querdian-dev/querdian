# Used by chart-testing (ct) and by `helm template` checks: every optional feature on.
replicaCount: 3
podAntiAffinityPreset: hard
management:
  service:
    enabled: true
ui:
  enabled: true
  auth: oidc
  adminGroup: querdian-admins
  service:
    enabled: true
serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
tracing:
  recordUser: true
  exporter: otlp
  otlp:
    endpoint: http://otel-collector.observability:4318
    protocol: http/protobuf
  samplerArg: "0.5"
  resourceAttributes:
    deployment.environment: test
oidcCA:
  existingSecret: oidc-ca
  key: ca.crt
extraArgs: ["--log-level=debug"]
config:
  backends:
    - name: metrics
      type: prometheus
      url: http://thanos-query.monitoring:10902
      pathPrefix: /prometheus
      namespaceLabel: namespace
    - name: logs
      type: loki
      url: http://loki-gateway.monitoring
      pathPrefix: /loki
      namespaceLabel: k8s_namespace_name
      tenantHeader: X-Scope-OrgID
      tenantFederation: tenantIdLabel
      forwardHeaders: [Accept, Accept-Encoding, User-Agent, X-Loki-Response-Encoding-Flags, X-Query-Tags]
    - name: traces
      type: tempo
      url: http://tempo-query-frontend.monitoring:3200
      pathPrefix: /tempo
      namespaceLabel: resource.k8s.namespace.name
      tenantHeader: X-Scope-OrgID
      traceByID: filter
networkPolicy:
  enabled: true
  ingress:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: grafana
    managementFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
  egress:
    tracing:
      enabled: true
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
  backendProtection:
    enabled: true
    targets:
      - namespace: monitoring
        podSelector:
          matchLabels:
            app.kubernetes.io/name: loki
        ports: [3100, 80]
        allowFrom:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: alloy
