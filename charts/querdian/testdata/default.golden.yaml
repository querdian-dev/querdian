# Source: querdian/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: r-querdian
  namespace: default
  labels:
    helm.sh/chart: querdian-0.0.0-dev
    app.kubernetes.io/name: querdian
    app.kubernetes.io/instance: r
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: querdian
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: querdian
      app.kubernetes.io/instance: r
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        checksum/config: 3579989e8955ff0075604006816c1c2cdccc39e49ce2c33655fd61873a13bc0f
      labels:
        helm.sh/chart: querdian-0.0.0-dev
        app.kubernetes.io/name: querdian
        app.kubernetes.io/instance: r
        app.kubernetes.io/version: "0.0.0-dev"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: querdian
    spec:
      serviceAccountName: r-querdian
      terminationGracePeriodSeconds: 45
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: querdian
          image: "ghcr.io/querdian-dev/querdian:0.0.0-dev"
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/querdian/config.yaml
            - --listen=:8080
            - --management-listen=:9090
            - --leader-elect=true
            - --log-level=info
            - --log-format=json
            - --tracing.record-user=false
            - --tracing.record-queries=false
          env:
            # Downward API values must precede OTEL_RESOURCE_ATTRIBUTES, which references them.
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(K8S_POD_NAME),k8s.namespace.name=$(K8S_NAMESPACE_NAME),k8s.node.name=$(K8S_NODE_NAME),service.version=0.0.0-dev"
            # The Go runtime uses 90 percent of the container memory limit as its soft memory limit.
            - name: QUERDIAN_MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            - name: OTEL_SERVICE_NAME
              value: "querdian"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: management
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: management
            failureThreshold: 3
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            limits:
              memory: 768Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/querdian
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: r-querdian
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: querdian
                    app.kubernetes.io/instance: r
