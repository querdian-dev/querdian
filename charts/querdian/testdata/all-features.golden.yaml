# Source: querdian/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: r-querdian
  namespace: default
  labels:
    helm.sh/chart: querdian-0.0.0-dev
    app.kubernetes.io/name: querdian
    app.kubernetes.io/instance: r
    app.kubernetes.io/version: "0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: querdian
data:
  config.yaml: |
    auth:
      audiences:
      - querdian
      caFile: /etc/querdian-oidc-ca/ca.crt
      claims:
        groups: groups
        username: preferred_username
      issuer: https://keycloak.example.com/realms/observability
    backends:
    - name: metrics
      namespaceLabel: namespace
      pathPrefix: /prometheus
      type: prometheus
      url: http://thanos-query.monitoring:10902
    - forwardHeaders:
      - Accept
      - Accept-Encoding
      - User-Agent
      - X-Loki-Response-Encoding-Flags
      - X-Query-Tags
      name: logs
      namespaceLabel: k8s_namespace_name
      pathPrefix: /loki
      tenantFederation: tenantIdLabel
      tenantHeader: X-Scope-OrgID
      type: loki
      url: http://loki-gateway.monitoring
    - name: traces
      namespaceLabel: resource.k8s.namespace.name
      pathPrefix: /tempo
      tenantHeader: X-Scope-OrgID
      traceByID: filter
      type: tempo
      url: http://tempo-query-frontend.monitoring:3200
    limits:
      maxFanout: 16
      maxMergeBytes: 67108864
      maxPolicyTerms: 16
      upstreamTimeout: 5m
