# Artifact Hub repository metadata for oci://ghcr.io/querdian-dev/charts/querdian.
# https://github.com/artifacthub/hub/blob/master/docs/metadata/artifacthub-repo.yml
#
# The release workflow pushes this file to the chart repository under the tag "artifacthub.io"
# (oras, media type application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml). It is not
# part of the chart package. See docs/releasing.md, section "Artifact Hub".

# ID of the repository in the Artifact Hub control panel (shown on the repository card once the
# repository has been added). Setting it makes the repository a verified publisher.
# repositoryID: 00000000-0000-0000-0000-000000000000

# Users who may claim ownership of the repository in Artifact Hub. The email must be the one of
# the Artifact Hub account.
owners:
  - name: geilername
    email: maximilian.marschall@3xm.at

# Release candidates are pipeline dry-runs (docs/releasing.md, section 3), not releases for users.
ignore:
  - name: querdian
    version: -rc\.
