<dialog class="search" id="search" aria-label="Search the documentation">
  <form method="dialog" class="search-form" role="search">
    <label class="sr" for="search-q">Search the documentation</label>
    <input id="search-q" type="search" autocomplete="off" spellcheck="false" placeholder="Search the docs" role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
    <button type="submit" class="search-close">Close <kbd aria-hidden="true">Esc</kbd></button>
  </form>
  <p class="search-status" id="search-status" role="status" aria-live="polite">Type to search all documentation pages.</p>
  <ul class="search-results" id="search-results" role="listbox" aria-label="Results"></ul>
</dialog>
