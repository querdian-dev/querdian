{{- $v := partial "docs-version.html" .Page -}}
<div class="docs-index">
{{ range $v.nav }}
  <section>
    <h2>{{ .title }}</h2>
    <ul>
    {{ range .pages }}{{ with site.GetPage (printf "%s/%s" $v.path (index (split . " | ") 0)) }}
      <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
    {{ end }}{{ end }}
    </ul>
  </section>
{{ end }}
</div>
