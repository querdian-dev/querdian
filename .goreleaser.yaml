# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: querdian

before:
  hooks:
    - go mod download

report_sizes: true

builds:
  - id: querdian
    main: ./cmd/querdian
    binary: querdian
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: querdian
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# SBOMs for the archives, generated with syft (installed by the release workflow).
sboms:
  - id: archive-sbom
    artifacts: archive
    documents:
      - "${artifact}.sbom.spdx.json"
    cmd: syft
    args: ["$artifact", "--output", "spdx-json=$document"]

# Multi-arch image (manifest list) built from the already-built release binaries.
# See the BINARY_SOURCE build arg in the Dockerfile.
dockers_v2:
  - id: querdian
    ids: [querdian]
    images:
      - ghcr.io/querdian-dev/querdian
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      BINARY_SOURCE: release
    labels:
      org.opencontainers.image.title: querdian
      org.opencontainers.image.description: Multi-tenant access proxy for Prometheus, Loki and Tempo
      org.opencontainers.image.source: https://github.com/querdian-dev/querdian
      org.opencontainers.image.url: https://github.com/querdian-dev/querdian
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
    sbom: true

# cosign keyless (GitHub OIDC token, Fulcio certificate, Rekor log). Requires
# `id-token: write` and cosign on PATH (sigstore/cosign-installer).
# cosign v3 writes a Sigstore bundle (signature, certificate and Rekor entry in one
# file) and ignores --output-signature/--output-certificate; without --bundle it fails.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    output: true
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

docker_signs:
  - id: images
    cmd: cosign
    artifacts: manifests
    output: true
    args:
      - sign
      - --yes
      - ${artifact}@${digest}

changelog:
  use: github
  sort: asc
  groups:
    - title: Breaking changes
      regexp: '^.*?(\([[:word:]]+\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Security
      regexp: '^.*?sec(urity)?(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^docs?(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - '^style(\(.+\))?:'
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: querdian-dev
    name: querdian
  prerelease: auto
  mode: replace
  footer: |
    ## Verify

    ```sh
    cosign verify ghcr.io/querdian-dev/querdian:{{ .Version }} \
      --certificate-identity-regexp '^https://github.com/querdian-dev/querdian/\.github/workflows/release\.yml@refs/tags/' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```
